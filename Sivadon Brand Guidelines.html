document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Sarabun';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"7cfbc46a-4a9a-447a-bc13-36850e8ab363\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  doc-page:not(:defined) { visibility: hidden; }\n  a { color: #00B085; text-decoration: none; }\n  a:hover { color: #00B085; }\n<\u002Fstyle>\n<script src=\"e957283e-86ea-43e0-bbd3-9915d3772289\"><\u002Fscript>\n<\u002Fhelmet>\n\n<doc-page margin=\"0.9in\">\n\n  <div slot=\"header\" style=\"display:flex;justify-content:space-between;align-items:baseline;font-family:Sarabun,sans-serif;font-size:9px;letter-spacing:0.14em;color:#8B8B8D;padding-bottom:8px;border-bottom:1px solid #E4E4E5\">\n    <span>SIVADON LOGISTICS<\u002Fspan>\n    <span>BRAND GUIDELINES · V1.0<\u002Fspan>\n  <\u002Fdiv>\n\n  <div slot=\"footer\" style=\"display:flex;justify-content:space-between;align-items:baseline;font-family:Sarabun,sans-serif;font-size:9px;letter-spacing:0.1em;color:#8B8B8D;padding-top:8px;border-top:1px solid #E4E4E5\">\n    <span>contact@sdcl.co.th<\u002Fspan>\n    <span>AUGUST 2026<\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"font-family:'Public Sans',sans-serif;color:#19191D;font-size:11pt;line-height:1.6\">\n\n    <!-- Cover -->\n    <div style=\"background:#19191D;color:#FFFFFF;padding:56px 48px;border-radius:10px;display:flex;flex-direction:column;gap:26px;margin-bottom:44px;break-inside:avoid\">\n      <img src=\"53ec4eed-3b58-4536-b39f-f95f827ab296\" alt=\"Sivadon\" style=\"height:34px;align-self:flex-start\">\n      <h1 style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:40pt;line-height:1.04;letter-spacing:-0.02em;margin:0\">Brand Guidelines<\u002Fh1>\n      <p style=\"font-size:12pt;line-height:1.6;color:#C5C5C6;margin:0;max-width:5in\">The rules for how Sivadon looks, sounds and behaves. Written for our marketing team, our agencies and anyone building on our behalf.<\u002Fp>\n      <div style=\"font-family:Sarabun,sans-serif;font-size:9pt;letter-spacing:0.14em;color:#00B085;padding-top:12px\">VERSION 1.0 · AUGUST 2026<\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Contents -->\n    <div style=\"break-inside:avoid;margin-bottom:36px\">\n      <h2 style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:16pt;margin:0 0 16px;letter-spacing:-0.01em\">Contents<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:6px 32px\">\n        <sc-for list=\"{{ toc }}\" as=\"t\" hint-placeholder-count=\"8\">\n          <div style=\"display:flex;gap:12px;font-size:10.5pt;padding:5px 0;border-bottom:1px solid #E4E4E5\">\n            <span style=\"font-family:Sarabun,sans-serif;font-size:9pt;color:#00B085\">{{ t.num }}<\u002Fspan>\n            <span>{{ t.label }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 01 Foundation -->\n    <h2 style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:20pt;letter-spacing:-0.015em;margin:0 0 6px;break-before:page;break-after:avoid\">01 · Brand foundation<\u002Fh2>\n    <p style=\"color:#55555A;margin:0 0 22px;max-width:5.4in\">Founded in 2022 by logistics and eCommerce veterans and backed by more than twenty years of nationwide operating history, Sivadon helps local businesses grow across Thailand and global brands scale across Southeast Asia. Everything in this document traces back to three ideas.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:32px\">\n      <sc-for list=\"{{ pillars }}\" as=\"p\" hint-placeholder-count=\"3\">\n        <div style=\"border:1px solid #E4E4E5;border-radius:16px;padding:18px;break-inside:avoid\">\n          <div style=\"font-family:Sarabun,sans-serif;font-size:8pt;letter-spacing:0.14em;color:#8B8B8D;margin-bottom:8px\">{{ p.kicker }}<\u002Fdiv>\n          <h3 style=\"font-family:'Public Sans',sans-serif;font-weight:600;font-size:12pt;margin:0 0 8px\">{{ p.title }}<\u002Fh3>\n          <p style=\"font-size:9.5pt;line-height:1.55;color:#55555A;margin:0\">{{ p.body }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <h3 style=\"font-family:'Public Sans',sans-serif;font-weight:600;font-size:13pt;margin:0 0 14px;break-after:avoid\">Logo<\u002Fh3>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;break-inside:avoid\">\n      <div style=\"border:1px solid #E4E4E5;border-radius:16px;background:#F3F3F3;padding:40px;display:flex;align-items:center;justify-content:center\">\n        <img src=\"d0d9164c-03fa-4b94-b65e-9394800f98b2\" alt=\"Sivadon logo\" style=\"width:180px;max-width:100%;padding:22px;outline:1px dashed #C5C5C6;outline-offset:20px\">\n      <\u002Fdiv>\n      <div style=\"border:1px solid #E4E4E5;border-radius:16px;background:#19191D;padding:40px;display:flex;align-items:center;justify-content:center\">\n        <img src=\"53ec4eed-3b58-4536-b39f-f95f827ab296\" alt=\"Sivadon logo reversed\" style=\"width:165px;max-width:100%\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:9.5pt;line-height:1.55;color:#8B8B8D;margin:0 0 20px;font-family:Sarabun,sans-serif\">The live files, straight from the site. Master: 2024/08/logo-sivadon.svg. Reversed: 2024/06/Logo.svg. A wide variant, Logo-1.svg, appears in the contact band. The square mark is only a JPG (cropped-Group), so it has a hard edge at small sizes. Still to produce: a vector mark, EPS for print, stacked and single-colour lockups.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:8px;break-inside:avoid\">\n      <div style=\"border:1px solid #E4E4E5;border-top:3px solid #00875F;border-radius:16px;padding:18px\">\n        <div style=\"font-size:8.5pt;font-weight:600;letter-spacing:0.12em;color:#00875F;margin-bottom:10px\">DO<\u002Fdiv>\n        <ul style=\"margin:0;padding-left:16px;font-size:9.5pt;line-height:1.5;color:#55555A;display:flex;flex-direction:column;gap:6px\">\n          <sc-for list=\"{{ logoDo }}\" as=\"r\" hint-placeholder-count=\"4\"><li>{{ r }}<\u002Fli><\u002Fsc-for>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #E4E4E5;border-top:3px solid #D0342C;border-radius:16px;padding:18px\">\n        <div style=\"font-size:8.5pt;font-weight:600;letter-spacing:0.12em;color:#D0342C;margin-bottom:10px\">DON'T<\u002Fdiv>\n        <ul style=\"margin:0;padding-left:16px;font-size:9.5pt;line-height:1.5;color:#55555A;display:flex;flex-direction:column;gap:6px\">\n          <sc-for list=\"{{ logoDont }}\" as=\"r\" hint-placeholder-count=\"4\"><li>{{ r }}<\u002Fli><\u002Fsc-for>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 02 Colour -->\n    <h2 style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:20pt;letter-spacing:-0.015em;margin:0 0 6px;break-before:page;break-after:avoid\">02 · Colour<\u002Fh2>\n    <p style=\"color:#55555A;margin:0 0 22px;max-width:5.4in\">Sivadon Green is the brand. Orange is the single conversion colour — the Contact Us and Submit buttons, nothing else. Everything in between is the Mono ramp. Token names match what is already in the website CSS.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:10px\">\n      <div style=\"border:1px solid #E4E4E5;border-radius:16px;overflow:hidden;break-inside:avoid\"><div style=\"height:70px;background:#00B085\"><\u002Fdiv><div style=\"padding:10px 12px\"><div style=\"font-size:9.5pt;font-weight:700\">Sivadon 80 · Primary<\u002Fdiv><div style=\"font-family:Sarabun,sans-serif;font-size:8.5pt;color:#8B8B8D\">#00B085 · --Sivadon-80<\u002Fdiv><div style=\"font-family:Sarabun,sans-serif;font-size:8pt;color:#8B8B8D;margin-top:3px\">Links, active states, mark<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"border:1px solid #E4E4E5;border-radius:16px;overflow:hidden;break-inside:avoid\"><div style=\"height:70px;background:#F58800\"><\u002Fdiv><div style=\"padding:10px 12px\"><div style=\"font-size:9.5pt;font-weight:700\">Orange 80 · Action<\u002Fdiv><div style=\"font-family:Sarabun,sans-serif;font-size:8.5pt;color:#8B8B8D\">#F58800 · --Orange-80<\u002Fdiv><div style=\"font-family:Sarabun,sans-serif;font-size:8pt;color:#8B8B8D;margin-top:3px\">One CTA per view; input focus<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"border:1px solid #E4E4E5;border-radius:16px;overflow:hidden;break-inside:avoid\"><div style=\"height:70px;background:#19191D\"><\u002Fdiv><div style=\"padding:10px 12px\"><div style=\"font-size:9.5pt;font-weight:700\">Mono 100<\u002Fdiv><div style=\"font-family:Sarabun,sans-serif;font-size:8.5pt;color:#8B8B8D\">#19191D · --Mono-100<\u002Fdiv><div style=\"font-family:Sarabun,sans-serif;font-size:8pt;color:#8B8B8D;margin-top:3px\">All body copy, headings, dark fills<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:9pt;color:#8B8B8D;margin:0 0 22px;font-family:Sarabun,sans-serif\">Pantone and CMYK equivalents are not yet specified. Have the printer match to #00B085 and #F58800 from a proof before any print run.<\u002Fp>\n\n    <div style=\"font-family:Sarabun,sans-serif;font-weight:600;font-size:8pt;letter-spacing:0.14em;color:#8B8B8D;margin-bottom:10px\">MONO RAMP<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:10px;break-inside:avoid\">\n      <div style=\"border:1px solid #E4E4E5;border-radius:12px;overflow:hidden\"><div style=\"height:40px;background:#19191D\"><\u002Fdiv><div style=\"padding:6px;font-family:Sarabun,sans-serif;font-size:7pt;color:#8B8B8D;text-align:center\">Mono 100<br>#19191D<\u002Fdiv><\u002Fdiv>\n      <div style=\"border:1px solid #E4E4E5;border-radius:12px;overflow:hidden\"><div style=\"height:40px;background:#55555A\"><\u002Fdiv><div style=\"padding:6px;font-family:Sarabun,sans-serif;font-size:7pt;color:#8B8B8D;text-align:center\">Mono 75<br>#55555A<\u002Fdiv><\u002Fdiv>\n      <div style=\"border:1px solid #E4E4E5;border-radius:12px;overflow:hidden\"><div style=\"height:40px;background:#8B8B8D\"><\u002Fdiv><div style=\"padding:6px;font-family:Sarabun,sans-serif;font-size:7pt;color:#8B8B8D;text-align:center\">Mono 50<br>#8B8B8D<\u002Fdiv><\u002Fdiv>\n      <div style=\"border:1px solid #E4E4E5;border-radius:12px;overflow:hidden\"><div style=\"height:40px;background:#C5C5C6\"><\u002Fdiv><div style=\"padding:6px;font-family:Sarabun,sans-serif;font-size:7pt;color:#8B8B8D;text-align:center\">Mono 25<br>#C5C5C6<\u002Fdiv><\u002Fdiv>\n      <div style=\"border:1px solid #E4E4E5;border-radius:12px;overflow:hidden\"><div style=\"height:40px;background:#F3F3F3\"><\u002Fdiv><div style=\"padding:6px;font-family:Sarabun,sans-serif;font-size:7pt;color:#8B8B8D;text-align:center\">Mono 15<br>#F3F3F3<\u002Fdiv><\u002Fdiv>\n      <div style=\"border:1px solid #E4E4E5;border-radius:12px;overflow:hidden\"><div style=\"height:40px;background:#FFFFFF;border-bottom:1px solid #E4E4E5\"><\u002Fdiv><div style=\"padding:6px;font-family:Sarabun,sans-serif;font-size:7pt;color:#8B8B8D;text-align:center\">Mono 0<br>#FFFFFF<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:9pt;color:#8B8B8D;margin:0 0 22px;font-family:Sarabun,sans-serif\">Mono 75 and Mono 15 are additions to the live set. Mono 75 gives secondary copy a step that passes AA on white — Mono 50 does not at body size.<\u002Fp>\n\n    <div style=\"font-family:Sarabun,sans-serif;font-weight:600;font-size:8pt;letter-spacing:0.14em;color:#8B8B8D;margin-bottom:10px\">TINTS — NEW, FOR BACKGROUNDS AND STATES<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:26px;break-inside:avoid\">\n      <div style=\"border:1px solid #E4E4E5;border-radius:12px;overflow:hidden\"><div style=\"height:40px;background:#00875F\"><\u002Fdiv><div style=\"padding:6px;font-family:Sarabun,sans-serif;font-size:7pt;color:#8B8B8D;text-align:center\">Sivadon 100<br>#00875F<\u002Fdiv><\u002Fdiv>\n      <div style=\"border:1px solid #E4E4E5;border-radius:12px;overflow:hidden\"><div style=\"height:40px;background:#00C795\"><\u002Fdiv><div style=\"padding:6px;font-family:Sarabun,sans-serif;font-size:7pt;color:#8B8B8D;text-align:center\">Sivadon 60<br>#00C795<\u002Fdiv><\u002Fdiv>\n      <div style=\"border:1px solid #E4E4E5;border-radius:12px;overflow:hidden\"><div style=\"height:40px;background:#CCEFE7\"><\u002Fdiv><div style=\"padding:6px;font-family:Sarabun,sans-serif;font-size:7pt;color:#8B8B8D;text-align:center\">Sivadon 15<br>#CCEFE7<\u002Fdiv><\u002Fdiv>\n      <div style=\"border:1px solid #E4E4E5;border-radius:12px;overflow:hidden\"><div style=\"height:40px;background:#D97800\"><\u002Fdiv><div style=\"padding:6px;font-family:Sarabun,sans-serif;font-size:7pt;color:#8B8B8D;text-align:center\">Orange 100<br>#D97800<\u002Fdiv><\u002Fdiv>\n      <div style=\"border:1px solid #E4E4E5;border-radius:12px;overflow:hidden\"><div style=\"height:40px;background:#FDE7CC\"><\u002Fdiv><div style=\"padding:6px;font-family:Sarabun,sans-serif;font-size:7pt;color:#8B8B8D;text-align:center\">Orange 15<br>#FDE7CC<\u002Fdiv><\u002Fdiv>\n      <div style=\"border:1px solid #E4E4E5;border-radius:12px;overflow:hidden\"><div style=\"height:40px;background:#E4E4E5\"><\u002Fdiv><div style=\"padding:6px;font-family:Sarabun,sans-serif;font-size:7pt;color:#8B8B8D;text-align:center\">Mono 20<br>#E4E4E5<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #E4E4E5;border-radius:16px;padding:18px;break-inside:avoid\">\n      <h3 style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:12pt;margin:0 0 12px\">Proportion &amp; contrast<\u002Fh3>\n      <div style=\"display:flex;height:26px;border-radius:8px;overflow:hidden;margin-bottom:12px\">\n        <div style=\"flex:65;background:#F3F3F3\"><\u002Fdiv>\n        <div style=\"flex:20;background:#19191D\"><\u002Fdiv>\n        <div style=\"flex:10;background:#00B085\"><\u002Fdiv>\n        <div style=\"flex:5;background:#F58800\"><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size:9.5pt;line-height:1.55;color:#55555A;margin:0 0 10px\">Roughly 65% neutral, 20% Mono 100, 10% green, 5% orange.<\u002Fp>\n      <p style=\"font-size:9.5pt;line-height:1.55;color:#55555A;margin:0 0 10px\"><strong>One correction to make.<\u002Fstrong> White text on Sivadon Green reads 2.8:1 and on Orange 2.5:1 — both fail AA at any size, and the live site does this on its green and Submit buttons. Set button labels in Mono 100 instead: 6.3:1 on green, 7.1:1 on orange. Green as text on white is 2.8:1, so reserve it for 24px and above.<\u002Fp>\n      <p style=\"font-size:9.5pt;line-height:1.55;color:#55555A;margin:0\">Product status colours — Success #00875F, Warning #B26A00, Error #D0342C — appear in interfaces only, never in marketing.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- 03 Typography -->\n    <h2 style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:20pt;letter-spacing:-0.015em;margin:0 0 6px;break-before:page;break-after:avoid\">03 · Typography<\u002Fh2>\n    <p style=\"color:#55555A;margin:0 0 22px;max-width:5.4in\">Public Sans carries English. Kanit carries Thai and Chinese — the site already swaps to it on :lang(th) and :lang(zh-CN). Sarabun is the third family; here it is fixed to one job, captions and data, so it stops competing with Public Sans.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:26px;break-inside:avoid\">\n      <div style=\"border:1px solid #E4E4E5;border-radius:16px;padding:20px\">\n        <div style=\"font-family:Sarabun,sans-serif;font-size:8pt;letter-spacing:0.14em;color:#8B8B8D;margin-bottom:10px\">EN — HEADINGS, BODY, UI<\u002Fdiv>\n        <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:32pt;line-height:1;letter-spacing:-0.02em\">Public Sans<\u002Fdiv>\n        <div style=\"font-family:'Public Sans',sans-serif;font-size:10pt;color:#55555A;margin-top:8px\">Regular 400 · Medium 500 · SemiBold 600 · Bold 700<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #E4E4E5;border-radius:16px;padding:20px\">\n        <div style=\"font-family:Sarabun,sans-serif;font-size:8pt;letter-spacing:0.14em;color:#8B8B8D;margin-bottom:10px\">TH · 中文 — ALL ROLES<\u002Fdiv>\n        <div style=\"font-family:Kanit,sans-serif;font-weight:600;font-size:26pt;line-height:1.1\">Kanit<\u002Fdiv>\n        <div style=\"font-family:Kanit,sans-serif;font-size:10pt;color:#55555A;margin-top:8px\">Regular 400 · Medium 500 · SemiBold 600 · Bold 700<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-raw-table style=\"width:100%;border-collapse:collapse;margin-bottom:26px;font-size:10pt\">\n      <sc-raw-thead>\n        <sc-raw-tr style=\"border-bottom:1px solid #C5C5C6\">\n          <sc-raw-th style=\"text-align:left;padding:8px 0;font-family:Sarabun,sans-serif;font-size:8pt;letter-spacing:0.12em;color:#8B8B8D;font-weight:400\">TOKEN<\u002Fsc-raw-th>\n          <sc-raw-th style=\"text-align:left;padding:8px 0;font-family:Sarabun,sans-serif;font-size:8pt;letter-spacing:0.12em;color:#8B8B8D;font-weight:400\">FAMILY &amp; WEIGHT<\u002Fsc-raw-th>\n          <sc-raw-th style=\"text-align:right;padding:8px 0;font-family:Sarabun,sans-serif;font-size:8pt;letter-spacing:0.12em;color:#8B8B8D;font-weight:400\">SIZE / LEADING<\u002Fsc-raw-th>\n          <sc-raw-th style=\"text-align:right;padding:8px 0;font-family:Sarabun,sans-serif;font-size:8pt;letter-spacing:0.12em;color:#8B8B8D;font-weight:400\">TRACKING<\u002Fsc-raw-th>\n        <\u002Fsc-raw-tr>\n      <\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-for list=\"{{ scale }}\" as=\"s\" hint-placeholder-count=\"10\">\n          <sc-raw-tr style=\"border-bottom:1px solid #E4E4E5\">\n            <sc-raw-td style=\"padding:9px 0;font-family:Sarabun,sans-serif;font-size:9pt\">{{ s.token }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:9px 0;color:#55555A\">{{ s.family }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:9px 0;text-align:right;font-family:Sarabun,sans-serif;font-size:9pt\">{{ s.size }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:9px 0;text-align:right;font-family:Sarabun,sans-serif;font-size:9pt;color:#8B8B8D\">{{ s.track }}<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-for>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n\n    <h3 style=\"font-family:'Public Sans',sans-serif;font-weight:600;font-size:13pt;margin:0 0 6px;break-after:avoid\">Multilingual — EN · TH · 中文<\u002Fh3>\n    <p style=\"font-size:10pt;color:#55555A;margin:0 0 14px;max-width:5.4in\">We publish in three languages, so the stack has to hold up in all three. Thai needs more leading than Latin; Simplified Chinese needs looser tracking and a heavier weight to match optical colour.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px;break-inside:avoid\">\n      <div style=\"border:1px solid #E4E4E5;border-radius:16px;padding:16px\">\n        <div style=\"font-family:Sarabun,sans-serif;font-size:7.5pt;letter-spacing:0.12em;color:#8B8B8D;margin-bottom:10px\">ENGLISH · PUBLIC SANS<\u002Fdiv>\n        <div style=\"font-family:'Public Sans',sans-serif;font-weight:600;font-size:13pt;line-height:1.15;margin-bottom:8px\">Nationwide delivery, all 77 provinces<\u002Fdiv>\n        <div style=\"font-size:9pt;line-height:1.5;color:#55555A\">Body 16/26. Headline leading 1.1–1.2, tracking −0.02em from 32px up.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #E4E4E5;border-radius:16px;padding:16px\">\n        <div style=\"font-family:Sarabun,sans-serif;font-size:7.5pt;letter-spacing:0.12em;color:#8B8B8D;margin-bottom:10px\">ไทย · KANIT<\u002Fdiv>\n        <div style=\"font-family:Kanit,sans-serif;font-weight:600;font-size:13pt;line-height:1.5;margin-bottom:8px\">จัดส่งทั่วประเทศ ครบทุกจังหวัด<\u002Fdiv>\n        <div style=\"font-size:9pt;line-height:1.5;color:#55555A\">Body 16/32. Never below 1.4 leading — Kanit's tone marks and upper vowels collide. No letterspacing on Thai, ever.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #E4E4E5;border-radius:16px;padding:16px\">\n        <div style=\"font-family:Sarabun,sans-serif;font-size:7.5pt;letter-spacing:0.12em;color:#8B8B8D;margin-bottom:10px\">中文 · KANIT<\u002Fdiv>\n        <div style=\"font-family:Kanit,sans-serif;font-weight:700;font-size:13pt;line-height:1.4;margin-bottom:8px\">全国配送，覆盖泰国各府<\u002Fdiv>\n        <div style=\"font-size:9pt;line-height:1.5;color:#55555A\">Body 16/30, tracking +0.02em. Kanit has no CJK glyphs, so pair it with Noto Sans SC in the stack and check every heading.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 04 Layout -->\n    <h2 style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:20pt;letter-spacing:-0.015em;margin:0 0 6px;break-before:page;break-after:avoid\">04 · Spacing, grid &amp; components<\u002Fh2>\n    <p style=\"color:#55555A;margin:0 0 22px;max-width:5.4in\">An 8px base unit. Every margin, padding, gap and component height is a multiple of it. If a value isn't on the scale, it's a mistake.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:26px;break-inside:avoid\">\n      <div style=\"border:1px solid #E4E4E5;border-radius:16px;padding:18px\">\n        <h3 style=\"font-family:'Public Sans',sans-serif;font-weight:600;font-size:12pt;margin:0 0 12px\">Scale<\u002Fh3>\n        <div style=\"font-family:Sarabun,sans-serif;font-size:9pt;line-height:2;color:#55555A\">8 · 16 · 24 · 32 · 48 · 64 · 96 · 144<\u002Fdiv>\n        <p style=\"font-size:9.5pt;line-height:1.55;color:#55555A;margin:10px 0 0\">Section padding 96 desktop / 48 mobile. Card padding 24. Gap between cards 20.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #E4E4E5;border-radius:16px;padding:18px\">\n        <h3 style=\"font-family:'Public Sans',sans-serif;font-weight:600;font-size:12pt;margin:0 0 12px\">Grid<\u002Fh3>\n        <div style=\"font-size:9.5pt;line-height:1.7;color:#55555A\">Desktop ≥1280 — 12 col, 24 gutter, 64 margin<br>Tablet 992–1279 — 8 col, 20 gutter, 40 margin<br>Mobile &lt;992 — 4 col, 16 gutter, 20 margin<br>Max content width 1280px.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #E4E4E5;border-radius:16px;padding:18px;margin-bottom:26px;break-inside:avoid\">\n      <h3 style=\"font-family:'Public Sans',sans-serif;font-weight:600;font-size:12pt;margin:0 0 14px\">Buttons<\u002Fh3>\n      <div style=\"display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px\">\n        <span style=\"background:#F58800;color:#19191D;padding:10px 20px;border-radius:16px;font-size:10pt;font-weight:700\">Contact us<\u002Fspan>\n        <span style=\"background:#00B085;color:#19191D;padding:10px 20px;border-radius:16px;font-size:10pt;font-weight:700\">Find out more<\u002Fspan>\n        <span style=\"border:1px solid #C5C5C6;color:#19191D;padding:10px 20px;border-radius:16px;font-size:10pt;font-weight:700\">Download rate card<\u002Fspan>\n        <span style=\"background:#E4E4E5;color:#8B8B8D;padding:10px 20px;border-radius:16px;font-size:10pt;font-weight:700\">Disabled<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"font-size:9.5pt;line-height:1.55;color:#55555A;margin:0\">One Orange primary per view — that is the conversion button. Green is the secondary for anything repeated, outline is tertiary. Labels set in Mono 100, not white. Height 48px, 44px minimum on mobile. Radius 16px on buttons, inputs and cards; 24px on pills — never mixed within one component.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #E4E4E5;border-radius:16px;padding:18px;break-inside:avoid\">\n      <h3 style=\"font-family:'Public Sans',sans-serif;font-weight:600;font-size:12pt;margin:0 0 10px\">Iconography<\u002Fh3>\n      <p style=\"font-size:9.5pt;line-height:1.55;color:#55555A;margin:0\">One family, outline only: 1.75px stroke on a 24px grid, round caps and joins, no fills, no two-tone. 24px in interfaces, 40px in marketing, always Mono 100 or Sivadon 80. Orange is reserved for the single call to action, never for icons. The site's mixed set of sourced SVGs should be replaced with a single licensed family.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- 05 Imagery + voice -->\n    <h2 style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:20pt;letter-spacing:-0.015em;margin:0 0 6px;break-before:page;break-after:avoid\">05 · Photography<\u002Fh2>\n    <p style=\"color:#55555A;margin:0 0 20px;max-width:5.4in\">Real operations, real people, real Thai locations. Stock warehouse photography with anonymous interiors undercuts the one thing we sell: that we actually run this network.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:34px;break-inside:avoid\">\n      <div style=\"border:1px solid #E4E4E5;border-top:3px solid #00875F;border-radius:16px;padding:18px\">\n        <div style=\"font-size:8.5pt;font-weight:600;letter-spacing:0.12em;color:#00875F;margin-bottom:10px\">SHOOT FOR<\u002Fdiv>\n        <ul style=\"margin:0;padding-left:16px;font-size:9.5pt;line-height:1.5;color:#55555A;display:flex;flex-direction:column;gap:6px\">\n          <sc-for list=\"{{ imgDo }}\" as=\"r\" hint-placeholder-count=\"4\"><li>{{ r }}<\u002Fli><\u002Fsc-for>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #E4E4E5;border-top:3px solid #D0342C;border-radius:16px;padding:18px\">\n        <div style=\"font-size:8.5pt;font-weight:600;letter-spacing:0.12em;color:#D0342C;margin-bottom:10px\">AVOID<\u002Fdiv>\n        <ul style=\"margin:0;padding-left:16px;font-size:9.5pt;line-height:1.5;color:#55555A;display:flex;flex-direction:column;gap:6px\">\n          <sc-for list=\"{{ imgDont }}\" as=\"r\" hint-placeholder-count=\"4\"><li>{{ r }}<\u002Fli><\u002Fsc-for>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h2 style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:20pt;letter-spacing:-0.015em;margin:0 0 6px;break-after:avoid\">06 · Voice &amp; tone<\u002Fh2>\n    <p style=\"color:#55555A;margin:0 0 20px;max-width:5.4in\">We write the way a good operations manager talks: specific, calm, and willing to name a number. Our customers are choosing who to trust with their inventory, and precision reads as competence.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px\">\n      <sc-for list=\"{{ voice }}\" as=\"v\" hint-placeholder-count=\"3\">\n        <div style=\"border:1px solid #E4E4E5;border-radius:16px;padding:16px;break-inside:avoid\">\n          <h3 style=\"font-family:'Public Sans',sans-serif;font-weight:600;font-size:11pt;margin:0 0 7px\">{{ v.title }}<\u002Fh3>\n          <p style=\"font-size:9pt;line-height:1.5;color:#55555A;margin:0\">{{ v.body }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:10pt;margin-bottom:8px\">\n      <sc-raw-thead>\n        <sc-raw-tr style=\"border-bottom:1px solid #C5C5C6\">\n          <sc-raw-th style=\"text-align:left;padding:8px 12px 8px 0;font-size:8.5pt;letter-spacing:0.12em;color:#00875F;width:50%\">WE WRITE<\u002Fsc-raw-th>\n          <sc-raw-th style=\"text-align:left;padding:8px 0 8px 12px;font-size:8.5pt;letter-spacing:0.12em;color:#D0342C\">NOT<\u002Fsc-raw-th>\n        <\u002Fsc-raw-tr>\n      <\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-for list=\"{{ copyPairs }}\" as=\"c\" hint-placeholder-count=\"4\">\n          <sc-raw-tr style=\"border-bottom:1px solid #E4E4E5\">\n            <sc-raw-td style=\"padding:11px 12px 11px 0;line-height:1.5;vertical-align:top\">{{ c.good }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:11px 0 11px 12px;line-height:1.5;color:#8B8B8D;vertical-align:top\">{{ c.bad }}<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-for>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n\n    <!-- 07 Applications -->\n    <h2 style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:20pt;letter-spacing:-0.015em;margin:0 0 6px;break-before:page;break-after:avoid\">07 · Applications<\u002Fh2>\n    <p style=\"color:#55555A;margin:0 0 20px;max-width:5.4in\">The same system on the surfaces that get made most often.<\u002Fp>\n\n    <div style=\"border:1px solid #E4E4E5;border-radius:16px;overflow:hidden;margin-bottom:16px;break-inside:avoid\">\n      <div style=\"background:#19191D;padding:36px;display:flex;flex-direction:column;gap:44px;position:relative;overflow:hidden\">\n        <div style=\"position:absolute;right:-30px;bottom:-50px;width:200px;height:200px;background:#00B085;border-radius:6px;opacity:0.5\"><\u002Fdiv>\n        <img src=\"53ec4eed-3b58-4536-b39f-f95f827ab296\" alt=\"Sivadon\" style=\"height:22px;position:relative;align-self:flex-start\">\n        <div style=\"position:relative\">\n          <div style=\"font-family:Sarabun,sans-serif;font-size:8pt;letter-spacing:0.16em;color:#00B085;margin-bottom:10px\">CAPABILITIES 2026<\u002Fdiv>\n          <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:24pt;line-height:1.08;color:#FFFFFF;letter-spacing:-0.02em;max-width:4in\">Your window to access Thailand<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:14px 18px;font-size:9.5pt;color:#55555A;border-top:1px solid #E4E4E5\">Deck title slide, 16:9. Mono 100 fill, a soft green shape bleeding off one corner, Sarabun kicker above the headline. Body slides invert: white fill, Mono 100 type, one green accent maximum.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;break-inside:avoid\">\n      <div style=\"border:1px solid #E4E4E5;border-radius:16px;overflow:hidden\">\n        <div style=\"padding:24px;display:flex;flex-direction:column;gap:36px\">\n          <img src=\"d0d9164c-03fa-4b94-b65e-9394800f98b2\" alt=\"Sivadon\" style=\"height:22px;align-self:flex-start\">\n          <div>\n            <div style=\"font-family:'Public Sans',sans-serif;font-weight:600;font-size:11pt\">Vorakij Punyashthiti<\u002Fdiv>\n            <div style=\"font-size:8.5pt;color:#8B8B8D;margin-bottom:7px\">CEO Thailand<\u002Fdiv>\n            <div style=\"font-family:Sarabun,sans-serif;font-size:8pt;color:#55555A;line-height:1.7\">096-798-8971<br>contact@sdcl.co.th<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:14px 18px;font-size:9.5pt;color:#55555A;border-top:1px solid #E4E4E5\">Business card, 90×55mm. Mark top left, contact details in Sarabun. Reverse is solid Mono 100 with the mark centred.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #E4E4E5;border-radius:16px;overflow:hidden\">\n        <div style=\"padding:24px;display:flex;flex-direction:column;gap:22px\">\n          <div style=\"font-family:Sarabun,sans-serif;font-size:8pt;letter-spacing:0.16em;color:#00B085\">MILESTONE<\u002Fdiv>\n          <div style=\"font-family:'Public Sans',sans-serif;font-weight:700;font-size:16pt;line-height:1.12;color:#19191D;letter-spacing:-0.015em\">220 countries, one point of contact<\u002Fdiv>\n          <img src=\"d0d9164c-03fa-4b94-b65e-9394800f98b2\" alt=\"Sivadon\" style=\"height:18px;align-self:flex-start\">\n        <\u002Fdiv>\n        <div style=\"padding:14px 18px;font-size:9.5pt;color:#55555A;border-top:1px solid #E4E4E5\">Social post, 1:1. Statistic-led, Mono 100 type on white, green kicker, logo bottom left. Photo variants use a dark scrim behind the logo.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:34px;padding-top:16px;border-top:1px solid #E4E4E5;font-size:9.5pt;color:#8B8B8D;line-height:1.6;break-inside:avoid\">\n      Questions about applying this system, or a case it doesn't cover: contact@sdcl.co.th. Sivadon Logistics, 450/2 Boonyasathit Building, 2nd Floor, Rama III Rd., Bangkhol, Bangkholaem, Bangkok 10120.\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdoc-page>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      toc: [\n        { num: \"01\", label: \"Brand foundation & logo\" },\n        { num: \"02\", label: \"Colour\" },\n        { num: \"03\", label: \"Typography\" },\n        { num: \"04\", label: \"Spacing, grid & components\" },\n        { num: \"05\", label: \"Photography\" },\n        { num: \"06\", label: \"Voice & tone\" },\n        { num: \"07\", label: \"Applications\" },\n        { num: \"—\", label: \"Contact & asset requests\" }\n      ],\n      pillars: [\n        { kicker: \"WHO WE ARE\", title: \"An operator, not a broker\", body: \"Twenty-plus years of nationwide operating history. We run the network we sell.\" },\n        { kicker: \"WHAT WE PROMISE\", title: \"Your window to Thailand\", body: \"Local businesses grow nationwide; global brands scale across Southeast Asia without building a country team.\" },\n        { kicker: \"HOW WE SOUND\", title: \"Precise and unhurried\", body: \"Specific numbers, plain sentences, no hype. Confidence comes from detail, not adjectives.\" }\n      ],\n      logoDo: [\n        \"Use the supplied SVG or EPS without modification.\",\n        \"Keep clear space equal to the mark's height on all four sides.\",\n        \"Minimum size: 24px on screen, 12mm in print.\",\n        \"Reverse to white on Mono 100, or a photo at 40%+ overlay.\"\n      ],\n      logoDont: [\n        \"Recolour, outline, shadow, or gradient the mark.\",\n        \"Stretch, rotate, or rebuild the lockup from live type.\",\n        \"Place it on Sivadon Green or Orange — the mark needs a neutral ground.\",\n        \"Set the wordmark in anything other than Public Sans Bold.\"\n      ],\n      scale: [\n        { token: \"display\", family: \"Public Sans Bold\", size: \"56 / 60\", track: \"−0.02em\" },\n        { token: \"h1\", family: \"Public Sans Bold\", size: \"44 / 50\", track: \"−0.02em\" },\n        { token: \"h2\", family: \"Public Sans Bold\", size: \"32 / 40\", track: \"−0.015em\" },\n        { token: \"h3\", family: \"Public Sans SemiBold\", size: \"24 / 32\", track: \"0\" },\n        { token: \"h4\", family: \"Public Sans SemiBold\", size: \"20 / 28\", track: \"0\" },\n        { token: \"body-lg\", family: \"Public Sans Regular\", size: \"20 / 32\", track: \"0\" },\n        { token: \"body\", family: \"Public Sans Regular\", size: \"16 / 26\", track: \"0\" },\n        { token: \"button\", family: \"Public Sans Bold\", size: \"18 / 24\", track: \"0\" },\n        { token: \"small\", family: \"Public Sans Regular\", size: \"14 / 22\", track: \"0\" },\n        { token: \"caption\", family: \"Sarabun SemiBold\", size: \"12 / 18\", track: \"+0.1em\" }\n      ],\n      imgDo: [\n        \"Sivadon vehicles, sites and staff, shot on location.\",\n        \"Natural light, cool neutral grade, no heavy filters.\",\n        \"People mid-task with hands visible — work in progress.\",\n        \"Wide establishing shots paired with one tight detail crop.\"\n      ],\n      imgDont: [\n        \"Generic stock warehouses with no identifying detail.\",\n        \"Boardroom handshakes, arrows, or globe composites.\",\n        \"Green or orange duotone overlays on photography.\",\n        \"Competitor liveries or unreleased client branding in frame.\"\n      ],\n      voice: [\n        { title: \"Specific over superlative\", body: \"\\\"220 countries\\\" and \\\"100% inventory accuracy\\\" do more work than \\\"world-class\\\". If a claim has a number, use the number.\" },\n        { title: \"Short sentences, full words\", body: \"Plain English that survives translation into Thai and Chinese. Avoid idiom and internal jargon.\" },\n        { title: \"Customer's outcome first\", body: \"Lead with what the customer gets, then how we do it. \\\"Focus on growth\\\" before \\\"in-house systems\\\".\" }\n      ],\n      copyPairs: [\n        { good: \"We deliver to all 77 provinces, typically within 48 hours.\", bad: \"We offer unparalleled, best-in-class delivery coverage.\" },\n        { good: \"Our team will reach out within 24 hours.\", bad: \"We'll be in touch as soon as humanly possible!\" },\n        { good: \"100% inventory accuracy, verified at every cycle count.\", bad: \"Accuracy you can trust, every single time.\" },\n        { good: \"Founded in 2022 by logistics and eCommerce veterans.\", bad: \"A revolutionary force disrupting Southeast Asian logistics.\" }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
